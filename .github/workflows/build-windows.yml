name: Build Windows Installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Generate icons
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pillow
          python -c "
          from PIL import Image, ImageDraw
          import os
          os.makedirs('src-tauri/icons', exist_ok=True)
          def make(size):
              img = Image.new('RGBA', (size, size), (52, 152, 219, 255))
              draw = ImageDraw.Draw(img)
              m = max(2, size // 5)
              draw.ellipse([m, m, size-m, size-m], fill=(255, 255, 255, 255))
              a = max(1, size // 8)
              c = size // 2
              draw.ellipse([c-a, c-a, c+a, c+a], fill=(231, 76, 60, 255))
              return img
          make(32).save('src-tauri/icons/32x32.png')
          make(128).save('src-tauri/icons/128x128.png')
          make(256).save('src-tauri/icons/128x128@2x.png')
          make(128).save('src-tauri/icons/icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128)])
          # simple icns placeholder (not needed for Windows)
          make(128).save('src-tauri/icons/icon.icns')
          print('Icons generated')
          "

      - name: Install frontend dependencies
        run: npm install

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Filament Charts ${{ github.ref_name }}
          releaseBody: |
            Windows installers for Filament Charts.
            - MSI installer
            - NSIS setup.exe
          releaseDraft: true
          prerelease: false
          args: ''

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-charts-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-charts-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
