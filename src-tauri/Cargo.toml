[package]
name = "filament-charts"
version = "0.1.0"
description = "A desktop app for managing filament color libraries and generating charts"
authors = ["pan127637129"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "filament_charts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
